services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-restaurant_reservation}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-restaurant_reservation}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@restaurant.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_ADMIN_TELEPHONE: ${SEED_ADMIN_TELEPHONE:-0000000000}
    ports:
      - "3010:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node src/seeders/sync.js && node src/seeders/seed.js && node src/server.js"

volumes:
  db_data:
